[project]
name = "languagebot"
version = "0.1.0"
description = "Telegram bot for personal English vocabulary learning with spaced repetition"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.14,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10,<4.0",
    "google-genai>=0.3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP047: PEP 695 generic syntax (`def f[T](...)`) parses only on 3.12+; the
# project targets 3.12 in Docker but is also developed/tested against 3.11
# locally, so keep old-style TypeVar generics for now.
ignore = ["UP047"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
